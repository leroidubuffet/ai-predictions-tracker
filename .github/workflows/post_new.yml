name: Post new predictions to Bluesky

on:
  push:
    branches:
      - main
    paths:
      - "predictions/*.yaml"
  workflow_dispatch:
    inputs:
      file:
        description: "Prediction file to post (e.g. predictions/2024-03-15-sam-altman.yaml)"
        required: true
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD and HEAD~1 to diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml atproto

      - name: Find prediction files to post
        id: find_new
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            echo "${{ inputs.file }}" > /tmp/new_predictions.txt
          else
            # List files added in this commit (A = added, not M = modified)
            NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'predictions/*.yaml')
            echo "$NEW_FILES" > /tmp/new_predictions.txt
          fi
          echo "Files to post:"
          cat /tmp/new_predictions.txt

      - name: Post each new prediction
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing: $file"
            python scripts/post_new.py "$file"
          done < /tmp/new_predictions.txt

      - name: Commit posted state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.yaml
          git diff --cached --quiet || git commit -m "chore: update posted state [skip ci]"
          git pull --rebase
          git push
