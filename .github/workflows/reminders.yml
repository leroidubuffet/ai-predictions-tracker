name: Post deadline reminders to Bluesky

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC daily
  workflow_dispatch:      # allow manual trigger for testing

jobs:
  reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated state/reminded.yaml

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml atproto

      - name: Run reminder scanner
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/reminders.py

      - name: Commit updated reminder state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/reminded.yaml
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update reminder state [skip ci]"
          git pull --rebase
          git push
