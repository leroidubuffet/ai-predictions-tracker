name: Validate predictions

on:
  push:
    paths:
      - "predictions/**"
      - "categories.yaml"
      - "scripts/validate.py"
  pull_request:
    paths:
      - "predictions/**"
      - "categories.yaml"
      - "scripts/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run validation
        run: python scripts/validate.py

      - name: Run tests
        run: python scripts/validate_test.py
