name: Validate predictions

on:
  push:
    paths:
      - "predictions/**"
      - "categories.yaml"
      - "scripts/**"
  pull_request:
    paths:
      - "predictions/**"
      - "categories.yaml"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml atproto

      - name: Validate all predictions
        run: python scripts/validate.py

      - name: Run all tests
        run: |
          python scripts/validate_test.py
          python scripts/post_new_test.py
          python scripts/reminders_test.py
