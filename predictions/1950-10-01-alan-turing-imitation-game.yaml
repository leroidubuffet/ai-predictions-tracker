notes: |
  From "Computing Machinery and Intelligence," Mind, Vol. LIX, No. 236,
  October 1950 — the paper that introduced the Turing Test. The 2000 deadline
  passed without the prediction being clearly met. By the mid-2020s, large
  language models routinely satisfy the 70% threshold Turing described,
  roughly 20-25 years late. The 10^9-bit storage requirement (~125 MB) was
  exceeded by consumer hardware decades before the capability arrived.
