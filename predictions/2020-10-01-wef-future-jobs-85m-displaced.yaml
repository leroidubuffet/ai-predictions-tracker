notes: |
  From the WEF Future of Jobs Report 2020, published October 2020.
  The 2025 deadline has passed. Exact verification of the 85M/97M figures
  is contested — job market disruption accelerated significantly with
  generative AI from 2023 onward, arguably faster than the report modelled.
  The net job creation framing was broadly accepted but the displacement
  numbers were not systematically tracked against a single baseline.
