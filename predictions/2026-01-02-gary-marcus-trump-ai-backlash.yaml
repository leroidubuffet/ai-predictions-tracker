prediction_text: |
  By the end of 2026, President Trump will have begun to distance himself from the aggressively
  pro-AI industry policies that characterized his AI strategy in 2025. The giant AI infrastructure
  plays (like Project Stargate) that he championed after his inauguration will look like an
  unprofitable and underused mistake. So will his utter failure to meaningfully regulate AI,
  against the will of voters and political leaders both left and right. Public backlash against
  data centers, rising energy prices and rapacious AI companies will grow. AI stocks may tank.
  Generative AI, once Silicon Valley's golden child, will start to look like a fad, a solution
  in search of a problem with economics that don't add up.
