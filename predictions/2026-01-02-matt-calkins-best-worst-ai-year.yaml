prediction_text: |
  2026 will be the best year for AI's practical, real-world capabilities and value while also
  being the worst year for its technological advancements. The best AI model in the world will
  gain less capability over the next 12 months than it has gained in any of the previous years.
  Yet at the same time, practical value will grow more than it has in years. We will see the
  smallest delta in technological capability and the largest delta in practical value. 2026 is
  when we begin to hear the echo of the AI boom in the form of meaningful economic output.
