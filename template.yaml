# Copy this file to predictions/YYYY-MM-DD-source-slug.yaml and fill it in.
# Run: ./new_prediction.sh "Source Name"

# When the prediction was made (ISO date, required)
prediction_date: YYYY-MM-DD

# Who made it — person or organization (required)
source_name: ""

# Link to the original source: interview, article, tweet, paper, etc. (optional but strongly encouraged)
source_url: ""

# The full verbatim or closely paraphrased prediction. Multi-line is fine. (required)
prediction_text: |


# ISO date for when the prediction is supposed to come true (optional)
# Use deadline_fuzzy for vague statements like "within a decade"
deadline: ""

# Human-readable form of the deadline, for display (optional)
deadline_fuzzy: ""

# Must match an entry in categories.yaml (required)
category: ""

# Role of the person making the prediction (required)
# researcher | practitioner | executive | investor | pundit
source_type: ""

# Set true if the source has a direct financial stake in the prediction being believed.
# e.g. a CEO promoting their product, a VC hyping their portfolio. (required)
conflict_of_interest: false

# pending | expired | notable (required)
# pending:  deadline hasn't passed
# expired:  deadline passed, nothing notable to record
# notable:  something worth noting happened — add context in notes
status: pending

# Additional context: source details, related claims, outcome notes (optional)
notes: |


# Custom hashtags for Bluesky posts. Overrides the default #AIPredictions.
# Space-separated, e.g. "#AIPredictions #AGI". Leave empty to use the default. (optional)
hashtags: ""

# Set true for historical/seed data to prevent the bot from posting it on import.
# Leave false for new predictions you want posted to Bluesky. (required)
skip_post: false

# For predictions with no deadline: how often elapsed-time reminders fire (optional, default: low).
# high: every 6 months | low: every year
importance: low

# Path to a screenshot of the original source, relative to the repo root.
# Store the file under predictions/assets/. Attached to the Bluesky post when present.
# e.g. predictions/assets/2024-03-15-altman-tweet.png (optional)
screenshot: ""
